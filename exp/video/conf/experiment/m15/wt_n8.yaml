# @package _global_
# M15 on Walking Tours, N = 8: chunks of the last 8 frames (0.8 s of video),
# masked in tubes through them. As wt_n1 otherwise; vision=vit_s for the larger
# ViT.
defaults:
  - /optim@optim_vision: adamw
  - override /dynamics: none
  - override /vision: vit_t
program: vision
name: m15/wt_n8
tags: [m15, wt, n8]
data:
  balls: null
  tours:
    data_version: ad6e56b5995e
    held_out: Zurich
    size: 64
    fps: 10.0
measure:
  clips: 64  # x 4 windows: 256 chunks of the held-out video per split (x 3)
vision:
  # Pixel reconstruction from z (off): switch on with vision.recon=<mu> (e.g. 1.0;
  # vision.recon_hidden sets the decoder's width), see exp.video.jepa.loss.
  recon: 0.0
  patch: 8
  # of the nine training videos of ad6e56b5995e (every 50th frame)
  pixel_mean: 0.46
  pixel_std: 0.28
  frames: 8
