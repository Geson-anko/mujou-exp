# @package _global_
# M17, I-JEPA's target encoder instead of SIGReg (MILESTONES.md, M17, decided
# 2026-11-13): a single stream cannot give SIGReg the i.i.d. samples it needs
# (results/m17.md, the measurements toward a per-data-point SIGReg). The
# prediction's targets are the tokens of an EMA of the encoder on the whole
# stack (jepa.ema), of momentum 0.996 per frame of time (time.frame, in which
# the stream advances 0.1 s), whatever the steps: the time constant
# -frame / ln m ~ 250 frames is 25 s of the stream for any data.streams and
# time.learn_interval. I-JEPA ramps m to 1 over a fixed number of epochs; a
# continual stream has none, so m stays constant. No SIGReg term
# (vision.sigreg 0: the stats still report S of the tokens, of no weight) and
# no past tokens. The representation is the T tokens of d each, D = T d = 1024:
# this arm T = 64 tokens (patch 32, tubelet 4: 4 slots x 4 x 4) of d = 16.
# No LayerNorm on the targets (vision.target_norm false), as in the arm of d = 2,
# where it would leave nothing of a token (+-1). The context masks of wt_n16
# on the 4 x 4 grid keep 4 (short range) and 1 (long range) of the 16
# patches of a slot visible, 0.75 and 0.94 masked (on 8 x 8: 18 and 8 of 64,
# 0.72 and 0.88; tests/video/jepa/test_masks.py). One stream
# (B = 1); everything else, the optimizer, 1800 s and the checkpoints every
# 300 s included, that of m17/tok_n16.
defaults:
  - /experiment@_here_: m17/tok_n16  # from the root: its m17/wt_n16 resolves
  - _self_
name: m17/ema_t64
tags: [m17, wt, n16, tok, ema, t64]
data:
  streams: 1
vision:
  patch: 32
  tubelet: 4
  token_dim: 16
  ema: 0.996
  sigreg: 0.0
  token_buffer: 0
