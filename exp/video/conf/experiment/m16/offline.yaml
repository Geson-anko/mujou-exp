# @package _global_
# The offline bound of M16 (task=offline): the encoder of an M15 run frozen as
# in the control (as balls_frozen, the job's "parent"), and the dynamics fit by
# Adam on windows of the training streams, through time; offline.local=true
# stops the gradient at one frame as in the nodes. The learner is that of the
# parent (it learns nothing here):
#   fleet submit ... +experiment=m16/offline learner=bp dynamics=big \
#       --set parent=<batch>/<run_id> --after <run_id> --host <host>
# The data is that of the online run it bounds: the 54000 frames (1800 s) of
# each stream, in windows of observed + the largest horizon (16 + 20).
defaults:
  - m16/balls_joint
  - _self_
name: m16/offline
tags: [m16, offline]
task: offline
vision:
  frozen: true
offline:
  local: false
  frames: 54000
  window: 36
