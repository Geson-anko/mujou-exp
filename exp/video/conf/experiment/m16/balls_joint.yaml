# @package _global_
# M16 on the balls: the vision of M15 (balls_n1: the three balls rendered at
# 32x32, the tiny ViT, AdamW) and the dynamics of M14 stage 2 (small, with the
# eligibility traces) learned together; the dynamics predicts the encoder's
# next z and sends it no credit. The learner (pc or bp) is for the command
# line: `learner=pc`.
# The vision is the setting M15 hands over (#13 of
# m15-balls-n1-broadcast-bp-v1, results/m15.md); the dynamics is #14 of the
# search on z (m16-balls-joint-bp-v1, studies/m16_balls_joint_bp.toml), which
# started from stage 2's #45 of M14 (results/m14.md).
defaults:
  - /optim@optim_vision: adamw
  - override /optim: adamw
  - override /dynamics: small
  - override /vision: vit_t
program: joint
name: m16/balls_joint
tags: [m16, balls, joint]
data:
  balls:
    radii: [0.06, 0.08, 0.10]
    obs: frames
    size: 32
vision:
  patch: 4
  # the mean and std of the pixels of the calib chunks (radii as above)
  pixel_mean: 0.03
  pixel_std: 0.12
  frames: 1
  # M15: JEPA with the reconstruction of the last frame through a spatial
  # broadcast decoder, #13 of m15-balls-n1-broadcast-bp-v1
  recon: 22.027155360581872
  recon_decoder: broadcast
  recon_hidden: 64
  sg: false
  sigreg_on: tokens
  sigreg: 0.056154096349569554
  mask_ratio: 0.5
optim_vision:
  lr: 0.00019690934633000297
  warmup: 60.0
# #14 of m16-balls-joint-bp-v1
dynamics:
  trace: false
  residual: true
  open_loop: 0.5
optim:
  lr: 6.612727237433702e-05
  tau_m: 0.330517506080283
  tau_v: 12.029949313767528
  warmup: 300.0
