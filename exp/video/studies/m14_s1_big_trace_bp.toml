# M14 stage 1 (the position of one ball): the big dynamics with the eligibility
# traces, searched by BP on the seeds 100/101 (design 5.4). Confirm the best with
# `just sweep confirm m14-s1-big-trace-bp-v1 --top 3 --learners bp,pc --seeds 0,1,2 ...`.
# The big dynamics is searched with the trace only; without it, it is run
# with the values found here (design 5.4).
# parallel and max_trials fit the slots measured by `fleet bench` (2026-11-03).
[study]
name = "m14-s1-big-trace-bp-v1"
overrides = ["+experiment=m14/s1", "learner=bp", "dynamics=big", "dynamics.trace=true", "phase=explore"]
seeds = [100, 101]
parallel = 6       # trials in flight (x 2 seeds runs)
max_trials = 60
res = "any_gpu"
gpu_mem = 3.0

[space]
"optim" = {categorical = ["sgd", "adamw", "graft_adam"]}
"optim.lr" = {float = [0.001, 0.3], log = true, when = "optim != 'adamw'"}
"optim.lr@adamw" = {float = [1e-5, 1e-2], log = true, when = "optim == 'adamw'"}
"optim.tau_m" = {float = [0.03, 3.0], log = true, when = "optim != 'sgd'"}
"optim.warmup" = {categorical = [0.0, 60.0, 300.0]}
"dynamics.residual" = {categorical = [true, false]}
"dynamics.open_loop" = {categorical = [0.0, 0.25, 0.5]}

# The best of M13 first: SGD at 0.03 per frame.
[[enqueue]]
"optim" = "sgd"
"optim.lr" = 0.03
